[project]
name = "photo-measure-mcp"
version = "0.1.0"
description = "MCP server: measure a key or flat part on a printed ArUco markerboard (Dolmario Local AI CAD kit)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mcp>=1.2,<2",
    "opencv-contrib-python>=4.8",
    "numpy>=1.26",
    "pillow>=10",
]

[tool.uv]
package = false
